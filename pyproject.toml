[project]
name = "europepmc-literature-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing Europe PMC literature search and article lookup."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]==2.2.0",  # pinned: official MCP Python SDK v2 (MCPServer API)
    "httpx>=0.27",
    "pydantic>=2.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["mcp_integration: needs the pinned MCP SDK installed (tests/test_mcp_inmemory.py)"]
